<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="../assets/icon.png" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reset password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            text-align: center;
            padding: 50px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            max-width: 250px;
            margin: auto;
            margin-top: -435px;
            margin-left: 660px;
        }
        h2 {
            text-align: left;
            color: #333;
        }

        label {
            display: block;  /* Ensures the label takes the full width and appears above input */
            margin-top: 30px; /* Adds spacing between labels and previous elements */
            color: #444;
            font-weight: bold;
            text-align: left;
        }
        input {
            width: 95%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-left: -15px;
        }

        button {
            margin-top: 15px;
            background-color: black;
            color: white;
            padding: 10px;
            width: 40%;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #555;
        }

        #b1{
            margin-left: 145px;
            border-radius: 50px;
            width: 30%;
            margin-top: 12px;
        }
              
        .message {
            margin-top: 10px;
            font-weight: bold;
            color: green;
        }

        nav {
            display: flex;
            align-items: center;
            height: 135px; 
            width: 100%;
            background: white;
            padding: 0 20px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1500; 
            flex-wrap: wrap;
        }
        
        #img img {
            margin-top: 0px;
            margin-left: 30px;
            height: 90px; 
            width: 700px; 
            max-height: 120px; 
        }

        .logo {
            color: cornflowerblue;
            font-size: 22px;
            font-weight: bold;
            margin-left: 1150px;
            margin-top: -200px;
        }
        
        /* Password input container */
        .password-container {
            position: relative;
            width: 90%;
            margin: 0 auto;
        }
        
        /* Password toggle icon */
        .password-toggle {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Eye icon styles */
        .eye-icon {
            width: 20px;
            height: 20px;
            stroke: #666;
            fill: none;
        }
        .img1 {
            margin-top: 50px;
            margin-left: -350px;
        }
        
        @media (max-width: 768px) {
            nav {
                flex-direction: column; 
                height: auto; 
                align-items: center;
            }
        
            #img img {
                display: flex;
                justify-content: left; 
                max-height: 70px;
                max-width: 580px;
                margin-left: -10px;
            }
        
            .logo {
                font-size: 12px;
                margin-left: -10px; 
                margin-top: 5px; 
                text-align: center; 
            }
        }

        @media screen and (max-width: 768px) {
            html{
                scroll-behavior: smooth;
            }
            body {
                overflow-x: hidden;
                max-width: 100%; /* Add padding for fixed navbar */
            }
            
            .img1 {
                margin: 20px auto;
                text-align: left;
                margin-left: 0px;
            }
            
            .img1 img {
                width: 100%;
                max-width: 300px;
                height: auto;
                display: block;
                margin: 0 auto;
            }
            
            .container {
                background: white;
                padding: 30px;
                max-width: 90%;
                width: 200px;
                margin: auto;
                margin-top: 10px;
            }
            #b1{
            height: 30px;
            margin-left: 110px;
            border-radius: 50px;
            width: 35%;
            margin-top: 12px;
            }
            h2{
                font-size: 18px;
                font-weight: bolder;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div id="img">
            <img src="/assets/logo.jpg" alt="Sample Image">
        </div>
        <div class="logo">
            CODE : CEC
        </div>
    </nav>

    <div class="img1">
        <img  src="../assets/rp.png" alt="Sample Image" >
    </div>

    <div class="container">
        <h2>Reset Your Password</h2>
        <input type="hidden" id="token" value="{{ token }}">
        
        <label for="new_password">New Password:</label>
        <div class="password-container">
            <input type="password" id="new_password" placeholder="Enter new password" required>
            <span class="password-toggle" onclick="togglePasswordVisibility('new_password', this)">
                <svg class="eye-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 5C5.63636 5 2 12 2 12C2 12 5.63636 19 12 19C18.3636 19 22 12 22 12C22 12 18.3636 5 12 5Z" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </span>
        </div>

        <label for="confirm_password">Confirm Password:</label>
        <div class="password-container">
            <input type="password" id="confirm_password" placeholder="Confirm new password" required>
            <span class="password-toggle" onclick="togglePasswordVisibility('confirm_password', this)">
                <svg class="eye-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 5C5.63636 5 2 12 2 12C2 12 5.63636 19 12 19C18.3636 19 22 12 22 12C22 12 18.3636 5 12 5Z" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </span>
        </div>

        <button id="b1" onclick="resetPassword()">Submit</button>
        <p id="message" class="message"></p>
    </div>

    <script>
        function togglePasswordVisibility(inputId, toggleElement) {
            const passwordInput = document.getElementById(inputId);
            const eyeIcon = toggleElement.querySelector('svg');
            
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                // Add a line through the eye when password is visible
                eyeIcon.innerHTML = `
                    <path d="M12 5C5.63636 5 2 12 2 12C2 12 5.63636 19 12 19C18.3636 19 22 12 22 12C22 12 18.3636 5 12 5Z" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <line x1="4" y1="4" x2="20" y2="20" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                `;
            } else {
                passwordInput.type = "password";
                // Return to normal eye icon when password is hidden
                eyeIcon.innerHTML = `
                    <path d="M12 5C5.63636 5 2 12 2 12C2 12 5.63636 19 12 19C18.3636 19 22 12 22 12C22 12 18.3636 5 12 5Z" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                `;
            }
        }
        
        function resetPassword() {
            const token = document.getElementById("token").value;
            const newPassword = document.getElementById("new_password").value;
            const confirmPassword = document.getElementById("confirm_password").value;
            const messageBox = document.getElementById("message");

            if (!newPassword || !confirmPassword) {
                messageBox.style.color = "red";
                messageBox.innerText = "❌ Please fill all fields!";
                return;
            }
            
            if (newPassword !== confirmPassword) {
                messageBox.style.color = "red";
                messageBox.innerText = "❌ Passwords do not match!";
                return;
            }

            fetch("http://localhost:5000/update-password-admin", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token: token, new_password: newPassword })
            })
            .then(response => response.json())
            .then(data => {
                messageBox.style.color = data.message.includes("✅") ? "green" : "red";
                messageBox.innerText = data.message;
            })
            .catch(error => {
                messageBox.style.color = "red";
                messageBox.innerText = "❌ Error resetting password.";
            });
        }
    </script>

</body>
</html>
